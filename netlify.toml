[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/investing"
  to = "/investor-builder"
  status = 301

[[redirects]]
  from = "/blog/author/*"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/store/*"
  to = "/"
  status = 301

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
